<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Attendance Predictor</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
        }

        .criteria {
            background: #f1f3ff;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 25px;
            font-size: 17px;
            font-weight: bold;
            color: #444;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }

        .input-group input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .predict-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .predict-btn:hover {
            background: #5568d9;
        }

        .result {
            display: none;
            margin-top: 30px;
        }

        .result-title {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .result-card {
            background: #f7f7f7;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
        }

        .result-card h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .result-card p {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .recommendation {
            margin-top: 20px;
            background: #f1f3ff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .recommendation h3 {
            margin-bottom: 10px;
            color: #444;
        }

        .recommendation p {
            color: #555;
            line-height: 1.5;
        }

        .success {
            color: green !important;
        }

        .warning {
            color: #d97706 !important;
        }

        .danger {
            color: red !important;
        }

        @media (max-width: 650px) {

            .form-grid,
            .result-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>🤖 AI Attendance Predictor</h1>

        <p>AI-powered student attendance risk analysis</p>

    </div>


    <div class="criteria">

        Required Attendance Criteria:
        <strong>75%</strong>

    </div>


    <!-- INPUT SECTION -->

    <div class="form-grid">

        <div class="input-group">

            <label>Classes Attended</label>

            <input
                type="number"
                id="classes_attended"
                placeholder="Example: 24"
                min="0">

        </div>


        <div class="input-group">

            <label>Total Classes</label>

            <input
                type="number"
                id="total_classes"
                placeholder="Example: 40"
                min="1">

        </div>


        <div class="input-group">

            <label>Assignment Score</label>

            <input
                type="number"
                id="assignment_score"
                placeholder="Example: 80"
                min="0"
                max="100">

        </div>


        <div class="input-group">

            <label>Internal Marks</label>

            <input
                type="number"
                id="internal_marks"
                placeholder="Example: 75"
                min="0"
                max="100">

        </div>

    </div>


    <button
        class="predict-btn"
        onclick="predictAttendance()">

        🔮 Predict Attendance Risk

    </button>


    <!-- RESULT SECTION -->

    <div
        class="result"
        id="resultBox">


        <h2 class="result-title">

            📊 Attendance Analysis

        </h2>


        <!-- AI PREDICTION -->

        <div
            class="result-card"
            style="margin-bottom: 15px; background: #f1f3ff;">

            <h3>AI Prediction</h3>

            <p id="resultText"></p>

        </div>


        <div class="result-grid">


            <div class="result-card">

                <h3>Current Attendance</h3>

                <p id="attendanceText"></p>

            </div>


            <div class="result-card">

                <h3>Required Criteria</h3>

                <p>75%</p>

            </div>


            <div class="result-card">

                <h3>Classes Attended</h3>

                <p id="classesText"></p>

            </div>


            <div class="result-card">

                <h3>Risk Level</h3>

                <p id="riskText"></p>

            </div>


            <div class="result-card">

                <h3>Classes Needed for 75%</h3>

                <p id="requiredText"></p>

            </div>


            <div class="result-card">

                <h3>AI Confidence</h3>

                <p id="confidenceText"></p>

            </div>


        </div>


        <div class="recommendation">

            <h3>💡 AI Recommendation</h3>

            <p id="recommendationText"></p>

        </div>


    </div>

</div>


<script>


async function predictAttendance() {


    const classesAttended = Number(
        document.getElementById("classes_attended").value
    );


    const totalClasses = Number(
        document.getElementById("total_classes").value
    );


    const assignmentScore = Number(
        document.getElementById("assignment_score").value
    );


    const internalMarks = Number(
        document.getElementById("internal_marks").value
    );


    // ---------------------------------------
    // VALIDATION
    // ---------------------------------------

    if (
        document.getElementById("classes_attended").value === "" ||
        document.getElementById("total_classes").value === "" ||
        document.getElementById("assignment_score").value === "" ||
        document.getElementById("internal_marks").value === ""
    ) {

        alert("Please fill all the fields.");

        return;
    }


    if (totalClasses <= 0) {

        alert("Total classes must be greater than 0.");

        return;
    }


    if (classesAttended > totalClasses) {

        alert(
            "Classes attended cannot be greater than total classes."
        );

        return;
    }


    // ---------------------------------------
    // SEND DATA TO BACKEND
    // ---------------------------------------

    const data = {

        classes_attended: classesAttended,

        total_classes: totalClasses,

        assignment_score: assignmentScore,

        internal_marks: internalMarks

    };


    try {


        const response = await fetch(
            "/predict",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            }
        );


        const result = await response.json();


        // ---------------------------------------
        // SHOW RESULT
        // ---------------------------------------

        document.getElementById(
            "resultBox"
        ).style.display = "block";


        document.getElementById(
            "attendanceText"
        ).innerText =
            result.attendance + "%";


        // AI PREDICTION

        document.getElementById(
            "resultText"
        ).innerText =
            result.result;


        document.getElementById(
            "classesText"
        ).innerText =
            result.classes_attended +
            " / " +
            result.total_classes;


        document.getElementById(
            "riskText"
        ).innerText =
            result.risk_level;


        document.getElementById(
            "requiredText"
        ).innerText =
            result.required_classes +
            " classes";


        document.getElementById(
            "confidenceText"
        ).innerText =
            result.confidence + "%";


        document.getElementById(
            "recommendationText"
        ).innerText =
            result.recommendation;


        // ---------------------------------------
        // RISK COLOR
        // ---------------------------------------

        const riskElement =
            document.getElementById("riskText");


        riskElement.classList.remove(
            "success",
            "warning",
            "danger"
        );


        if (result.risk_level === "LOW RISK") {

            riskElement.classList.add("success");

        }

        else if (result.risk_level === "MEDIUM RISK") {

            riskElement.classList.add("warning");

        }

        else {

            riskElement.classList.add("danger");

        }


    }

    catch (error) {


        alert(
            "Unable to connect to backend. Make sure Flask server is running."
        );


        console.error(error);

    }

}


</script>


</body>

</html>
